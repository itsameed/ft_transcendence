name: CI

on:
  push:
    branches: [main, zakaria, devops]
  pull_request:

jobs:
  check:
    name: Typecheck and backend syntax
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-v2
        run: npm ci

      - name: Typecheck
        working-directory: frontend-v2
        run: npx tsc -b

      - name: Check backend syntax
        shell: bash
        run: |
          shopt -s globstar nullglob
          for file in backend/src/**/*.js backend/scripts/*.js; do
            node --check "$file"
          done

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-v2
        run: npm ci

      - name: Build frontend
        working-directory: frontend-v2
        run: npm run build

  docker-check:
    name: Docker configuration and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create test environment file
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build backend frontend