name: CI

# Mirrors lefthook.yml: typecheck + backend syntax on every PR/push,
# full production build as the push gate.
on:
  push:
    branches: [main, zakaria]
  pull_request:

jobs:
  check:
    name: Typecheck + backend syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b

      - name: Backend syntax check
        run: |
          shopt -s globstar nullglob
          for f in backend/src/**/*.js backend/scripts/*.js; do
            node --check "$f"
          done

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
