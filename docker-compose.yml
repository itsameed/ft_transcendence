services:
  mongodb:
    image: mongo:7.0.14-jammy
    container_name: ft_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cn_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongodb:27017/ft_transcendence
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data: